x-app: &app
  build:
    context: .
    target: app
  env_file:
    - path: .env
      required: false
  volumes:
    - ./config.toml:/app/config.toml:ro
    - ./data:/app/data:ro
    - ./extractions:/app/extractions
    - ./state:/app/state
    - ./out:/app/out

x-dev: &dev
  build:
    context: .
    target: dev
  entrypoint: ["sh", "-c"]
  volumes:
    - ./src:/app/src
    - ./tests:/app/tests
    - ./out/quality:/app/out/quality
  profiles: ["quality"]

services:
  recon:
    <<: *app

  review:
    <<: *app
    entrypoint:
      - streamlit
      - run
      - src/recon/review_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.gatherUsageStats=false
    command: []
    ports:
      - "127.0.0.1:8501:8501"

  scheduler:
    <<: *app
    command: ["schedule"]
    restart: unless-stopped
    healthcheck:
      # unhealthy if no check has run for 2 intervals (default interval 15 min)
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('state/heartbeat') > 1800)"]
      interval: 5m
      start_period: 1m

  # ---------- tests and code quality: docker compose --profile quality run --rm <name> ----------
  test:
    <<: *dev
    command: ["pytest --cov --cov-report=term --cov-report=xml:out/quality/coverage.xml"]

  lint:
    <<: *dev
    command:
      - >-
        ruff check src tests && ruff format --check src tests && mypy

  format:
    <<: *dev
    command: ["ruff check --fix --exit-zero src tests; ruff format src tests"]
